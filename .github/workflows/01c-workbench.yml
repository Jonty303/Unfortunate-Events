name: 01C source validation workbench
on:
  push:
    branches: [visual-prototype-01]
    paths: ['.github/workflows/01c-workbench.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Package source and pinned test runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/runtime transfer/source
          cp -a visual-prototype-01 transfer/source/
          cp -a .github transfer/source/
          curl -fL --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip' -o transfer/runtime/godot.zip
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  transfer/runtime/godot.zip' | sha256sum --check
          git rev-parse HEAD > transfer/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ue-01c-workbench
          path: transfer/
          include-hidden-files: true
          retention-days: 1
