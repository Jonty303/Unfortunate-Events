            ('art/03b_near_forest.png', '09f71eb44845f2b92c4352b0136aa19378eda09da68c467fb2c4d2c3bdbf9869', 'https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-c1a0-81f4-8b0f-ae263331e32d/raw?se=2026-11-11T11%3A52%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=01a1ca6a-fc9a-7b46-a127-81dfc6102534&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T09%3A19%3A24Z&ske=2026-11-12T09%3A19%3A24Z&sks=b&skv=2026-06-06&sig=7XhKOX/yuu/7BjMzvE8mJ89uMZx3qrGBZkMqhLy1QT4%3D'),
