name: One-time visual prototype artwork import
on:
  push:
    branches: [visual-prototype-01]
    paths: [.github/workflows/import-visual-prototype-art.yml]
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download and verify original artwork
        shell: python
        run: |
          import hashlib, pathlib, urllib.request
          # Temporary read-only URLs reference only the artwork being published.
          # SHA-256 checks require byte-identical copies of the supplied prototype.
          assets = [
            ('art/01_atmosphere.png', 'e0b608124bb33844605e97f9a54934df0f832b80fd43a1bbb08d6e3330716f2b', 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-af5c-8210-a748-38cf22092e12/raw?se=2026-11-11T11%3A52%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=01a1ca6a-fc9a-7b46-a127-81dfc6102534&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T06%3A39%3A56Z&ske=2026-11-12T06%3A39%3A56Z&sks=b&skv=2026-06-06&sig=Kwd0NG/vIpGP5LMdSbppeh4YVVw6IpThPi20lF8cry0%3D'),
