            ('art/05_near_rocks.png', '94146fa58a8a750de35191c2cb3fc79a8ebcfa28e641f64637ecb625e293f021', 'https://oaisdmntprpolandcentral.blob.core.windows.net/files/00000000-d38c-820a-93eb-5baab28f57f8/raw?se=2026-11-11T11%3A52%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=01a1ca6a-fc9a-7b46-a127-81dfc6102534&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T09%3A40%3A27Z&ske=2026-11-12T09%3A40%3A27Z&sks=b&skv=2026-06-06&sig=/FcmQhA0wtAHjdrkmxyuxCsuwNRXu9uc8/5ZCrJY35k%3D'),
            ('art/06_antique_shuttle.png', 'fa63f8e51e8d0a9e71f804f46a516fdcc7e42d03ba3112f4087cdb4626e66c92', 'https://oaisdmntprukwest.blob.core.windows.net/files/00000000-ab04-8243-9763-25d158d2982b/raw?se=2026-11-11T11%3A52%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=01a1ca6a-fc9a-7b46-a127-81dfc6102534&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T07%3A21%3A51Z&ske=2026-11-12T07%3A21%3A51Z&sks=b&skv=2026-06-06&sig=cNGhs87Y1Dx0MaxIfWQFyu38ntGoSmWQFSVVWZCaJGI%3D'),
