            ('art/08_launcher.png', '3b354fc6256bb2c1b05b3fc71c4892e2310ea010ffaa3753647942485cd306ca', 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-85b8-8210-a7dd-59f1183c1e08/raw?se=2026-11-11T11%3A52%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=01a1ca6a-fc9a-7b46-a127-81dfc6102534&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T08%3A44%3A22Z&ske=2026-11-12T08%3A44%3A22Z&sks=b&skv=2026-06-06&sig=0KqgJDCrXvP0fp%2Bi2/K3ekDFpVW/cxz0SdPJb4PpsDk%3D'),
            ('art/09_facility.png', '4cc5e21d6e543ae572a963eadffad4623cfbaa13134a36df288d27885716ad9b', 'https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-3a4c-81f4-b616-b39072113dc1/raw?se=2026-11-11T11%3A52%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=01a1ca6a-fc9a-7b46-a127-81dfc6102534&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T08%3A23%3A13Z&ske=2026-11-12T08%3A23%3A13Z&sks=b&skv=2026-06-06&sig=/2wrwD2B4m76Ybkg03zM9aChasWOb2doJuh16MN7YKQ%3D'),
            ('art/10_hangar.png', '807c80cefa6493f8f66b2563e530dcff2fa50ec32dee26479e92f431bb7c90b1', 'https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-89c8-81f4-ba7a-adf001cba443/raw?se=2026-11-11T11%3A52%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=01a1ca6a-fc9a-7b46-a127-81dfc6102534&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T09%3A40%3A44Z&ske=2026-11-12T09%3A40%3A44Z&sks=b&skv=2026-06-06&sig=V10Ru7th3TmElLvWKiQIJeJ9UMGT9qCNDsoFVzPl2hk%3D'),
            ('preview.jpg', 'e3c173075cf5a71344590d178a6722b6791793accac382976c53570c68db2f30', 'https://oaisdmntprdenmarkeast.blob.core.windows.net/files/00000000-f96c-8210-a1a3-c8481dcb7e6b/raw?se=2026-11-11T11%3A52%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=01a1ca6a-fc9a-7b46-a127-81dfc6102534&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T09%3A19%3A13Z&ske=2026-11-12T09%3A19%3A13Z&sks=b&skv=2026-06-06&sig=ec25eSQHG8UcV7GSznTK24bwNi0qO2FA3N9KVC8DG3A%3D')
          ]
          verified = []
          for name, expected, url in assets:
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise RuntimeError('Checksum mismatch: ' + name)
              verified.append((name, data))
              print('Verified', name, actual, len(data))
          for name, data in verified:
              path = pathlib.Path('visual-prototype-01') / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
      - name: Commit artwork to this branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- visual-prototype-01/art visual-prototype-01/preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'feat: include verified original visual prototype artwork'
            git push origin HEAD:refs/heads/visual-prototype-01
          fi
